# dERP — app + db, helyi / általános Docker-gépre. Az `e2e` profil a 16. munkacsomagban jön.
# Indítás: cp deploy/.env.example deploy/.env (titkok kitöltése), majd
#   docker compose -f deploy/compose.yaml up -d
# A plasticgarden NAS-on NEM ez fut, hanem a compose.nas.yaml (TrueNAS Custom App), ld. docs/telepites.md.
name: derp

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: derp-app:${DERP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://derp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kell a deploy/.env-ben}@db:5432/derp
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET kell a deploy/.env-ben}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TZ_DISPLAY: ${TZ_DISPLAY:-Europe/Budapest}
      DERP_MODULES: ${DERP_MODULES:-*}
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      # A visits modul ICS-tokenjeinek hash-eléséhez; ha a modul aktív, nélküle az app nem indul el.
      ICS_TOKEN_PEPPER: ${ICS_TOKEN_PEPPER:-}
      # Mappafigyelő (watch modul): a figyelt szerver-mappa bejárásának gyakorisága másodpercben (0 = csak kézzel).
      WATCH_INTERVAL_SEC: ${WATCH_INTERVAL_SEC:-300}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "${DERP_HOST_PORT:-8080}:8080"
    volumes:
      # Feltöltött fájlok és bélyegképek (docs modul, DATA_DIR); a konténer cseréjét túléli.
      - ${DERP_FILES_DIR:-files-data}:/data/files
      # A figyelt szerver-mappa (watch modul, WATCH_ROOT=/watch), csak olvashatóan; a konténer UID 1000-ként olvassa.
      # Alapból egy üres, névvel ellátott kötet; valós mappához DERP_WATCH_DIR=<hoszt-útvonal>.
      - ${DERP_WATCH_DIR:-watch-data}:/watch:ro
    mem_limit: 384m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: derp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kell a deploy/.env-ben}
      POSTGRES_DB: derp
    volumes:
      - ${DERP_DB_DIR:-db-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derp -d derp"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

volumes:
  db-data:
  files-data:
  watch-data:
